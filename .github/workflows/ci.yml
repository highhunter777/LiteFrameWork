name: CI

# L1（dotnet 单测）门禁 —— 秒级、不需要 Unity。
# 依据《测试开发方案》§4 ① 与 §7.2 缺口 a、§7.3 改进 ①。
on:
  push:
    branches: [ LiteGame, main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'   # UTC 19:00 = 北京 03:00——夜间回归（M10 长跑层）

jobs:
  l1-dotnet-test:
    name: L1 dotnet test（${{ matrix.os }}）
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    # 跨平台 matrix（《测试开发方案》§7.5 缺口 j）：Sim/协议/打包纯函数必须**跨运行时一致**才算被验，
    # 只在 Windows 跑等于没验——误差恰恰出在平台差异上（M7 FMA/超越函数结论的直接延续）。
    # 已核对无平台专属依赖：临时目录走 Path.GetTempPath、路径一律 Ordinal + '/' 归一化、
    # BuildHash 两端同为"行尾归一化 + 相对路径排序"、无 Win32/注册表 API。
    strategy:
      fail-fast: false          # 一个平台红不影响另一个平台出结论
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20         # 超时保护（防挂死占满额度）

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 基线防篡改校验需要能 diff 到比较基准

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: false                # NuGet 缓存间歇损坏（Setup 红根因之一）；关闭换稳定

      - name: 基线防篡改校验（仅 ubuntu 跑一次）
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        # 基线（Baselines/*.txt）是确定性的**裁判**：被随手改掉会静默掩盖确定性回归。
        # 轻量纪律：改动基线必须在 PR 标题/正文或提交信息里带 [baseline] 标记（说明为何重录）。
        run: |
          set -euo pipefail
          BASE=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch --depth=100 origin "$BASE_REF" >/dev/null 2>&1 || true
            BASE="origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && git rev-parse -q --verify "$BEFORE_SHA^{commit}" >/dev/null; then
            BASE="$BEFORE_SHA"
          fi
          if [ -z "$BASE" ] || ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            BASE="HEAD~1"
          fi
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "无法确定比较基准（浅历史/首个提交），跳过基线校验"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD -- 'Tests/**/Baselines/**' || true)
          if [ -z "$changed" ]; then
            echo "✓ 基线未变更"
            exit 0
          fi
          echo "检测到基线文件变更："
          echo "$changed"
          if printf '%s\n%s\n%s\n' "$PR_TITLE" "$PR_BODY" "$HEAD_MSG" | grep -qi '\[baseline\]'; then
            echo "✓ 已声明 [baseline]"
            exit 0
          fi
          echo "::error::基线文件被修改但未声明。请在 PR 标题/正文或提交信息中加 [baseline] 并说明为何重录（基线是确定性的裁判，静默改动会掩盖回归）。"
          exit 1

      - name: L0 依赖与秘密扫描（仅 windows 跑一次）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/l0-dep-scan.ps1 -ProjectPath ${{ github.workspace }}

      - name: L1 快速测试
        shell: pwsh
        run: ./scripts/test.ps1 -Lane L1 -Profile PullRequest

      - name: Upload L1 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-${{ matrix.os }}-${{ github.run_attempt }}
          path: TestResults/**
          if-no-files-found: warn

  l3-network-test:
    name: L3 network test（${{ matrix.os }}）
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: L3 网络与无头集成测试
        shell: pwsh
        run: ./scripts/test.ps1 -Lane L3 -Profile PullRequest

      - name: Upload L3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l3-${{ matrix.os }}-${{ github.run_attempt }}
          path: TestResults/**
          if-no-files-found: warn

  # ── L2（Unity 侧）门禁 ────────────────────────────────────────────────────
  # 为什么需要：L1 按路径 glob 编译、不读 .meta 也不经 Unity 编译器——2026-09-15 那次
  #   16 个非法 GUID 的 .meta 事故里 L1 全绿而 Unity 编译是坏的（详见 Docs/CI门禁（L1-L2）.md）。
  # 为什么默认不跑：GitHub-hosted runner 跑不了本工程的 Unity 侧——
  #   ① 仓库按约定只含自研代码/预制品/文档，ProjectSettings/美术素材/场景/Odin 均不入库，
  #      全新克隆工程无法编译（见 Docs/克隆后自备清单.md）
  #   ② 编辑器是 Unity 中国版 2022.3.55f1c1，GitHub 镜像与授权都不匹配
  # 因此 L2 走**自托管 runner（Windows + 完整工程）**，并用仓库变量 L2_ENABLED=true 开启。
  l2-unity-gate:
    name: L2 Unity 侧门禁 + Player 构建/冒烟（自托管 runner）
    if: ${{ vars.L2_ENABLED == 'true' }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: L2 门禁（非法 meta 扫描 + Unity 编译/测试状态）
        shell: powershell
        # 编辑器在跑 → 经 Unity Pipeline 查询（无需关闭编辑器）；未跑 → batchmode EditMode 测试
        run: powershell -NoProfile -File scripts/l2-unity-gate.ps1 -ProjectPath ${{ github.workspace }}

      - name: C0 Player 构建（Windows x64 IL2CPP）
        shell: powershell
        run: powershell -NoProfile -File scripts/build-player.ps1 -ProjectPath ${{ github.workspace }} -Profile BuildProfiles/windows-x64.json -SkipRestoreCheck

      - name: C0 Player 启动冒烟
        shell: powershell
        run: powershell -NoProfile -File scripts/player-smoke.ps1 -ProjectPath ${{ github.workspace }} -TimeoutSec 30

  # ── 夜间回归层（M10 长跑）─────────────────────────────────────────────
  # 5 分钟全量对跑（HeadlessRunTests.全量对跑_5分钟）由环境变量 M10_LONGRUN=1 门控：
  # 常规 L1 门禁不跑（拖慢 push），夜间/手动跑——对跑观测和解率与无卡顿累积（§9 M10 验收）。
  # 顺带每晚全量 L1 再验一轮（跨平台 matrix 同白昼门禁）。
  nightly-longrun:
    name: 夜间回归（长跑 + 全量 L1）
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 夜间 L1
        shell: pwsh
        run: ./scripts/test.ps1 -Lane L1 -Profile Nightly

      - name: 夜间 L3（含 5 分钟长跑）
        shell: pwsh
        run: ./scripts/test.ps1 -Lane L3 -Profile Nightly

      - name: Upload nightly results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.os }}-${{ github.run_attempt }}
          path: TestResults/**
          if-no-files-found: warn
